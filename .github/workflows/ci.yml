name: ci

# Quality gates for every pull request (ST-002): formatting, analyzers (warnings are errors), unit tests,
# Windows client build, backend container build, web lint/typecheck/test/build, research lint/test, and
# conventional commits. "ci-ok" is the single required check on main; areas a PR doesn't touch are skipped.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      client: ${{ steps.areas.outputs.client }}
      backend: ${{ steps.areas.outputs.backend }}
      web: ${{ steps.areas.outputs.web }}
      research: ${{ steps.areas.outputs.research }}
      schema: ${{ steps.areas.outputs.schema }}
      design: ${{ steps.areas.outputs.design }}
      hardware: ${{ steps.areas.outputs.hardware }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: areas
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          base=""
          if [ "$EVENT" = "pull_request" ]; then base="$PR_BASE"; elif [ "$EVENT" = "push" ]; then base="$PUSH_BEFORE"; fi
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            files="__all__"
          else
            files=$(git diff --name-only "$base" HEAD)
          fi
          printf 'Changed files:\n%s\n' "$files"
          common='^(Directory\.Build\.props|global\.json|\.editorconfig|\.gitattributes|\.github/workflows/ci\.yml|shared/)'
          flag() {
            if [ "$files" = "__all__" ] || printf '%s\n' "$files" | grep -Eq "$1|$common"; then echo "$2=true"; else echo "$2=false"; fi
          }

          # Without the shared files, unlike flag(). This one has to match hardware-checks.yml's paths:
          # exactly, because the gate below waits for that workflow and a flag that says yes where the
          # filter says no waits for a run that never starts. Widening the filter to match instead was
          # the other way to make them agree, and it meant a one-line workflow edit took over the
          # laptop's keyboard; the hosted Windows job still builds and tests everything either way.
          only() {
            if [ "$files" = "__all__" ] || printf '%s\n' "$files" | grep -Eq "$1"; then echo "$2=true"; else echo "$2=false"; fi
          }
          {
            flag '^client/' client
            flag '^(backend/|\.dockerignore)' backend
            flag '^(web/|\.nvmrc)' web
            flag '^research/' research
            flag '^(shared/schema/|client/ScreenTail\.Shared/Generated/|web/src/generated/)' schema
            flag '^(shared/design/|client/ScreenTail\.UI/Theme/.*\.g\.xaml|web/src/styles/tokens\.g\.css|docs/ux/review-hifi/)' design
            # Whether this PR needs an answer from a real machine. Must stay in step with the paths in
            # hardware-checks.yml: if this says yes and that workflow does not run, the gate below waits
            # for evidence that is never coming.
            only '^(client/ScreenTail\.(Service|Core)/(Capabilities|Detection|Input|Capture|Privacy|Store|Ipc|Sessions|Speech)/|client/ScreenTail\.Platform/|client/ScreenTail\.Tests\.Windows/|scripts/windows/|\.github/workflows/hardware-checks\.yml)' hardware
          } >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

      # ST-018, the second half of the skip gate. The budget in skip-baseline.json is a ratchet: a pull
      # request may tighten it freely and may not loosen it, so adding a skip cannot quietly buy itself
      # room. Raising a number is a decision that has to be argued for, not a side effect.
      - name: The skip budget has not been raised
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          FILE: client/ScreenTail.Tests.Windows/skip-baseline.json
        run: |
          if ! git cat-file -e "$BASE:$FILE" 2>/dev/null; then
            echo "No baseline on the base branch yet; nothing to compare."
            exit 0
          fi
          git show "$BASE:$FILE" > /tmp/base-baseline.json
          bad=0
          for envname in $(jq -r '.environments | keys[]' "$FILE"); do
            was=$(jq -r ".environments.\"$envname\".maxSkipped // empty" /tmp/base-baseline.json)
            if [ -z "$was" ]; then echo "$envname: new, nothing to compare"; continue; fi
            now=$(jq -r ".environments.\"$envname\".maxSkipped" "$FILE")
            echo "$envname: was $was, now $now"
            if [ "$now" -gt "$was" ]; then
              echo "::error file=$FILE::The '$envname' skip budget went from $was to $now. It may only go down. A test that skips is a fact nobody is checking; if the machine genuinely cannot run it, say so in the PR and get agreement rather than widening the gate."
              bad=1
            fi
          done
          exit $bad

  client:
    name: Client (Windows)
    needs: changes
    if: needs.changes.outputs.client == 'true'
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore ScreenTail.sln
      - name: Format and analyzers
        run: dotnet format ScreenTail.sln --verify-no-changes --no-restore
      - name: Build (warnings are errors)
        run: dotnet build ScreenTail.sln -c Release --no-restore
      # Each test app is run directly rather than through `dotnet test`, so that it writes a TRX the
      # skip gate below can read. `dotnet test` exits 0 when every test skips, which is the hole ST-018
      # closes, and its argument forwarding does not reach xUnit's own -result-trx.
      - name: Test
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'trx'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $failed = $false
          foreach ($proj in 'ScreenTail.Tests/ScreenTail.Tests.csproj', 'ScreenTail.Tests.Windows/ScreenTail.Tests.Windows.csproj') {
            $name = [System.IO.Path]::GetFileNameWithoutExtension($proj)
            $dll = (dotnet msbuild $proj -getProperty:TargetPath -p:Configuration=Release) |
              Where-Object { $_ -match '\.dll\s*$' } | Select-Object -Last 1
            if (-not $dll) { throw "msbuild reported no TargetPath for $proj." }
            $dll = $dll.Trim()
            if (-not (Test-Path $dll)) { throw "No test binary for $proj at '$dll'." }
            Write-Host "== $name"
            dotnet $dll -result-trx (Join-Path $out "$name.trx")
            if ($LASTEXITCODE -ne 0) { Write-Host "::error::$name exited $LASTEXITCODE"; $failed = $true }
          }
          if ($failed) { exit 1 }

      - name: Skip gate
        if: always()
        working-directory: ${{ github.workspace }}
        run: ./scripts/windows/check-skips.ps1 -Environment hosted -TrxGlob '${{ runner.temp }}/trx/*.trx'

      # ST-016: render the component gallery in dark, light and high contrast. Catches runtime XAML
      # errors the compiler can't, and produces the screenshots the ticket asks for.
      - name: Gallery screenshots
        timeout-minutes: 4
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'gallery'
          dotnet run --project ScreenTail.UI -c Release --no-build -- --gallery --screenshot $out
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $files = Get-ChildItem $out -Filter '*.png'
          if ($files.Count -lt 3) { throw "Expected 3 gallery screenshots, found $($files.Count)." }
          $files | ForEach-Object { "$($_.Name) $($_.Length) bytes" }

      # ST-070: the same trick for the shell. RenderTargetBitmap draws offscreen, so this works on a
      # runner with no interactive desktop — which is what makes a WPF shell checkable without a machine
      # to look at. A blank or tiny PNG means the window rendered nothing, which is what a missing
      # resource key or a style on the wrong target type actually produces.
      - name: Shell screenshots
        timeout-minutes: 4
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'gallery'
          $log = Join-Path $env:RUNNER_TEMP 'shell-render.log'
          dotnet run --project ScreenTail.UI -c Release --no-build -- --screenshot $out | Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $shell = Get-ChildItem $out -Filter 'shell-*.png'
          if ($shell.Count -lt 6) { throw "Expected 6 shell screenshots, found $($shell.Count)." }
          $panel = Get-ChildItem $out -Filter 'panel-*.png'
          if ($panel.Count -lt 3) { throw "Expected 3 diagnostics-panel screenshots, found $($panel.Count)." }
          # The renderer reports how many distinct colours it drew. A window that rendered nothing is one
          # flat rectangle; anything with text, borders and a badge on it is hundreds. File size was the
          # first version of this and was wrong - it failed on a shell that had just been improved,
          # because flat colour compresses smaller than the drop shadow it replaced.
          $counts = Select-String -Path $log -Pattern 'distinct colours' -AllMatches
          foreach ($line in $counts) {
            if ($line -match '(\d+) distinct colours') {
              if ([int]$Matches[1] -lt 20) { throw "$line - the shell rendered nothing." }
            }
          }
          $shell | ForEach-Object { "$($_.Name) $($_.Length) bytes" }

      # ST-074: the note pane, rendered against research/fixtures/handcrafted in all six states and three
      # themes. Its AC is "renders fixture with no backend", and this is that sentence as a check.
      - name: Note pane screenshots
        timeout-minutes: 4
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'gallery'
          $log = Join-Path $env:RUNNER_TEMP 'note-render.log'
          dotnet run --project ScreenTail.UI -c Release --no-build -- --note --screenshot $out | Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $notes = Get-ChildItem $out -Filter 'note-*.png'
          if ($notes.Count -lt 18) { throw "Expected 18 note-pane screenshots, found $($notes.Count)." }
          $counts = Select-String -Path $log -Pattern 'distinct colours' -AllMatches
          foreach ($line in $counts) {
            if ($line -match '(\d+) distinct colours') {
              if ([int]$Matches[1] -lt 20) { throw "$line - the note pane rendered nothing." }
            }
          }
          # A binding to a property that does not exist does not throw and does not stop the layout - it
          # leaves the control blank. A pane missing one label still has hundreds of distinct colours, so
          # every other check here would pass. The render collects them; this is where they bite.
          $bindings = Select-String -Path $log -Pattern '^(\d+) binding errors$'
          if (-not $bindings) { throw "The render did not report a binding-error count." }
          if ([int]$bindings.Matches[0].Groups[1].Value -ne 0) { throw "$($bindings.Line) - see the step log." }
          $notes | ForEach-Object { "$($_.Name) $($_.Length) bytes" }

      # ST-072: the recording pill in all ten variants and three themes. Spec §5 S2 names each state and
      # INV-4 makes this the indicator a technician trusts, so "renders per spec" is checked by rendering.
      - name: HUD screenshots
        timeout-minutes: 4
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'gallery'
          $log = Join-Path $env:RUNNER_TEMP 'hud-render.log'
          dotnet run --project ScreenTail.UI -c Release --no-build -- --hud --screenshot $out | Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $hud = Get-ChildItem $out -Filter 'hud-*.png'
          if ($hud.Count -lt 30) { throw "Expected 30 HUD screenshots, found $($hud.Count)." }
          $counts = Select-String -Path $log -Pattern 'distinct colours' -AllMatches
          foreach ($line in $counts) {
            if ($line -match '(\d+) distinct colours') {
              if ([int]$Matches[1] -lt 8) { throw "$line - the pill rendered nothing." }
            }
          }
          $bindings = Select-String -Path $log -Pattern '^(\d+) binding errors$'
          if (-not $bindings) { throw "The render did not report a binding-error count." }
          if ([int]$bindings.Matches[0].Groups[1].Value -ne 0) { throw "$($bindings.Line) - see the step log." }
          $hud | ForEach-Object { "$($_.Name) $($_.Length) bytes" }

      - name: Upload gallery screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gallery-screenshots
          path: ${{ runner.temp }}/gallery
          if-no-files-found: warn

  backend:
    name: Backend (build, test, container)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # ST-008. The tests run the whole API over SQLite so the model and every query are exercised on any
    # machine, including a build box with no database. What SQLite cannot check is the migration SQL, so
    # a real Postgres is started here and the real migrations are applied to it below. Between the two,
    # nothing about the data layer is taken on trust.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci-only-not-a-secret
          POSTGRES_DB: screentail
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore ScreenTail.Backend.sln
      - name: Format and analyzers
        run: dotnet format ScreenTail.Backend.sln --verify-no-changes --no-restore
      - name: Build (warnings are errors)
        run: dotnet build ScreenTail.Backend.sln -c Release --no-restore
      - name: Test
        run: dotnet test ScreenTail.Backend.sln -c Release --no-build

      # The migrations are what a deployment actually runs, and they are generated code: a model change
      # that produces SQL Postgres rejects would pass every test above and fail on the day it ships.
      - name: Migrations apply to a real Postgres
        env:
          ConnectionStrings__Postgres: Host=localhost;Port=5432;Database=screentail;Username=postgres;Password=ci-only-not-a-secret
          Jwt__SigningKey: ci-only-signing-key-that-is-long-enough
        run: |
          dotnet tool install --global dotnet-ef --version 10.0.12
          export PATH="$PATH:$HOME/.dotnet/tools"
          dotnet ef database update --project src/ScreenTail.Api --startup-project src/ScreenTail.Api --no-build -c Release

          # Applying twice must be a no-op. A migration that is not idempotent breaks the second
          # deployment rather than the first, which is the one nobody is watching.
          dotnet ef database update --project src/ScreenTail.Api --startup-project src/ScreenTail.Api --no-build -c Release

      - name: Every table the model declares exists
        env:
          PGPASSWORD: ci-only-not-a-secret
        run: |
          missing=0
          for table in tenants users devices integrations policies session_metrics; do
            if ! psql -h localhost -U postgres -d screentail -tAc "select to_regclass('public.$table')" | grep -q "^$table$"; then
              echo "::error::The migrations did not create '$table'."
              missing=1
            fi
          done
          exit $missing

      - name: Container build
        working-directory: .
        run: docker build -f backend/Dockerfile -t screentail-api:ci .

  web:
    name: Web
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  research:
    name: Research
    needs: changes
    if: needs.changes.outputs.research == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: research
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: research/requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

  schema:
    name: Schema (examples, generated code up to date)
    needs: changes
    if: needs.changes.outputs.schema == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: shared/schema
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: shared/schema/package-lock.json
      - run: npm ci
      - name: Examples validate
        run: npm test
      - name: Generated C# and TypeScript match the schema
        run: npm run check

  design:
    name: Design tokens (generated code up to date)
    needs: changes
    if: needs.changes.outputs.design == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: shared/design
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Generated WPF dictionaries and CSS match tokens.json
        run: npm run check

      # ST-015: the Review hi-fi's contrast report is measured from tokens.json, not written by hand, and
      # this is what keeps it true after a token change. It exits non-zero on any pair under its floor.
      - name: Review hi-fi still passes AA contrast
        working-directory: docs/ux/review-hifi
        run: python3 contrast.py

  workflows:
    name: Workflows are well-formed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      # A duplicate key is valid YAML — the last one silently wins — but GitHub rejects the file, and a
      # bad merge resolution produces exactly that. This says which key and which line, before the push.
      - name: No duplicate keys, every job has steps
        run: |
          python3 - <<'EOF'
          import pathlib, sys, yaml

          bad = []

          class Loader(yaml.SafeLoader):
              pass

          def mapping(loader, node, deep=False):
              seen, out = set(), {}
              for key_node, value_node in node.value:
                  key = loader.construct_object(key_node, deep=deep)
                  if key in seen:
                      bad.append(f"{path}: duplicate key {key!r} on line {key_node.start_mark.line + 1}")
                  seen.add(key)
                  out[key] = loader.construct_object(value_node, deep=deep)
              return out

          Loader.add_constructor(yaml.resolver.BaseResolver.DEFAULT_MAPPING_TAG, mapping)

          for path in sorted(pathlib.Path(".github/workflows").glob("*.yml")):
              document = yaml.load(path.read_text(), Loader)
              for name, job in document.get("jobs", {}).items():
                  if not job.get("steps"):
                      bad.append(f"{path}: job {name!r} has no steps")

          print("\n".join(bad) if bad else "workflows look fine")
          sys.exit(1 if bad else 0)
          EOF

  commits:
    name: Conventional commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          pattern='^(feat|fix|docs|test|ci|chore|refactor|perf|build|style|revert)(\([a-z0-9._/-]+\))?!?: .+'
          bad=0
          for sha in $(git rev-list --no-merges "$BASE..$HEAD"); do
            subject=$(git log -1 --format=%s "$sha")
            if ! printf '%s\n' "$subject" | grep -Eq "$pattern"; then
              echo "::error::Commit $sha is not a conventional commit (Guide §5)."
              printf '  subject: %s\n' "$subject"
              bad=1
            fi
            if ! git log -1 --format=%B "$sha" | grep -Eq '^Refs: ST-[0-9]{3}'; then
              echo "::error::Commit $sha has no 'Refs: ST-###' footer (Guide §5)."
              bad=1
            fi
          done
          exit $bad

  # ST-018. hardware-checks.yml runs on the spare laptop and cannot be a `needs:` of ci-ok, because it
  # is a different workflow. This job is the bridge: it waits for that workflow's jobs on this commit and
  # fails if they did not pass, so the one required check on main covers hardware evidence too.
  #
  # Before this, `hardware-checks` was not required by anything. It could fail, or never run, and a PR
  # touching the capture path merged green (docs/review/weaknesses.md P1-4).
  #
  # Pull requests only, and that is the whole of it: hardware-checks.yml has no `push` trigger, so on a
  # merge to main this job waited thirty-five minutes for laptop jobs that were never going to be created
  # and then failed, taking ci-ok with it. Three merges went red that way on 2026-09-16 with nothing
  # wrong in them. Re-checking on the merge would buy nothing anyway: branch protection means every
  # commit on main arrived through a pull request, where this gate already ran and would have blocked it.
  hardware-gate:
    name: Hardware evidence
    needs: changes
    if: always() && github.event_name == 'pull_request' && needs.changes.outputs.hardware == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      checks: read
      pull-requests: write
    steps:
      - name: Wait for the spare laptop
        env:
          GH_TOKEN: ${{ github.token }}
          HW_RUNNER: ${{ vars.HW_RUNNER }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          required='Spare laptop - capabilities and real-window tests
          Spare laptop - input injection (takes over the keyboard)'

          if [ "${HW_RUNNER:-false}" != "true" ]; then
            # The laptop is off. Saying so on the pull request is the point: this is the state in which
            # every capture claim on the branch is unverified, and it should be visible rather than
            # inferred from a workflow that quietly did not run.
            {
              echo "## Hardware evidence: none"
              echo
              echo "\`HW_RUNNER\` is not \`true\`, so the spare laptop did not run. Nothing on this branch that needs"
              echo "a real desktop, a real screen or real input has been checked."
              echo
              echo "To get evidence: sign in on SCREENTRAIL, start the runner interactively, set the \`HW_RUNNER\`"
              echo "repository variable to \`true\`, and re-run this workflow."
            } >> "$GITHUB_STEP_SUMMARY"
            if [ -n "${PR:-}" ]; then
              gh label create needs-hardware-evidence --repo "$REPO" --color 'B60205' \
                --description 'Touches the capture path; the spare laptop has not verified it' 2>/dev/null || true
              gh pr edit "$PR" --repo "$REPO" --add-label needs-hardware-evidence || true
            fi
            echo "::warning::No hardware evidence for this branch; labelled needs-hardware-evidence."
            exit 0
          fi

          if [ -n "${PR:-}" ]; then
            gh pr edit "$PR" --repo "$REPO" --remove-label needs-hardware-evidence 2>/dev/null || true
          fi

          deadline=$(( $(date +%s) + 2100 ))

          # A job that has not even been created after five minutes is not a slow job, it is one that is
          # never coming: a path filter that disagrees with this one, or a workflow that did not trigger.
          # Waiting the full thirty-five minutes to say so held a runner for half an hour and buried the
          # reason under a timeout message.
          appeared=$(( $(date +%s) + 300 ))
          while :; do
            runs=$(gh api "repos/$REPO/commits/$SHA/check-runs?per_page=100" --paginate \
              --jq '.check_runs[] | [.name, .status, (.conclusion // "")] | @tsv' || true)
            pending=0
            missing=0
            failed=0
            while IFS= read -r name; do
              [ -z "$name" ] && continue
              line=$(printf '%s\n' "$runs" | awk -F'\t' -v n="$name" '$1 == n {print; exit}')
              if [ -z "$line" ]; then
                missing=$((missing + 1))
                continue
              fi
              status=$(printf '%s' "$line" | cut -f2)
              conclusion=$(printf '%s' "$line" | cut -f3)
              if [ "$status" != "completed" ]; then
                pending=$((pending + 1))
              elif [ "$conclusion" != "success" ] && [ "$conclusion" != "skipped" ]; then
                echo "::error::$name concluded '$conclusion'."
                failed=$((failed + 1))
              fi
            done <<< "$(printf '%s\n' "$required" | sed 's/^ *//')"

            if [ "$failed" -gt 0 ]; then
              echo "The spare laptop did not pass. This branch touches the capture path, so that is a blocker."
              exit 1
            fi
            if [ "$pending" -eq 0 ] && [ "$missing" -eq 0 ]; then
              echo "The spare laptop passed on $SHA." | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            if [ "$missing" -gt 0 ] && [ "$pending" -eq 0 ] && [ "$(date +%s)" -ge "$appeared" ]; then
              echo "::error::$missing of the spare laptop's jobs never started. hardware-checks.yml did not run for this commit: check that its paths: filter and the 'hardware' flag in this file still agree."
              exit 1
            fi

            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::Waited 35 minutes and the spare laptop's jobs are still $pending pending, $missing missing. A run that never reports is the same as one that failed: there is no evidence."
              exit 1
            fi
            echo "waiting: $pending running, $missing not started yet"
            sleep 20
          done

  ci-ok:
    name: ci-ok
    if: always()
    needs: [changes, client, backend, web, research, schema, design, commits, workflows, hardware-gate]
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          printf '%s\n' "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if printf '%s\n' "$RESULTS" | jq -e 'to_entries | any(.value.result != "success" and .value.result != "skipped")' >/dev/null; then
            echo "::error::A required job failed or was cancelled."
            exit 1
          fi
