name: ci

# Quality gates for every pull request (ST-002): formatting, analyzers (warnings are errors), unit tests,
# Windows client build, backend container build, web lint/typecheck/test/build, research lint/test, and
# conventional commits. "ci-ok" is the single required check on main; areas a PR doesn't touch are skipped.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      client: ${{ steps.areas.outputs.client }}
      backend: ${{ steps.areas.outputs.backend }}
      web: ${{ steps.areas.outputs.web }}
      research: ${{ steps.areas.outputs.research }}
      schema: ${{ steps.areas.outputs.schema }}
      design: ${{ steps.areas.outputs.design }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: areas
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          base=""
          if [ "$EVENT" = "pull_request" ]; then base="$PR_BASE"; elif [ "$EVENT" = "push" ]; then base="$PUSH_BEFORE"; fi
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            files="__all__"
          else
            files=$(git diff --name-only "$base" HEAD)
          fi
          printf 'Changed files:\n%s\n' "$files"
          common='^(Directory\.Build\.props|global\.json|\.editorconfig|\.gitattributes|\.github/workflows/ci\.yml|shared/)'
          flag() {
            if [ "$files" = "__all__" ] || printf '%s\n' "$files" | grep -Eq "$1|$common"; then echo "$2=true"; else echo "$2=false"; fi
          }
          {
            flag '^client/' client
            flag '^(backend/|\.dockerignore)' backend
            flag '^(web/|\.nvmrc)' web
            flag '^research/' research
            flag '^(shared/schema/|client/ScreenTail\.Shared/Generated/|web/src/generated/)' schema
            flag '^(shared/design/|client/ScreenTail\.UI/Theme/.*\.g\.xaml|web/src/styles/tokens\.g\.css)' design
          } >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  client:
    name: Client (Windows)
    needs: changes
    if: needs.changes.outputs.client == 'true'
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore ScreenTail.sln
      - name: Format and analyzers
        run: dotnet format ScreenTail.sln --verify-no-changes --no-restore
      - name: Build (warnings are errors)
        run: dotnet build ScreenTail.sln -c Release --no-restore
      - name: Test
        run: dotnet test ScreenTail.sln -c Release --no-build

      # ST-016: render the component gallery in dark, light and high contrast. Catches runtime XAML
      # errors the compiler can't, and produces the screenshots the ticket asks for.
      - name: Gallery screenshots
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'gallery'
          dotnet run --project ScreenTail.UI -c Release --no-build -- --gallery --screenshot $out
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $files = Get-ChildItem $out -Filter '*.png'
          if ($files.Count -lt 3) { throw "Expected 3 gallery screenshots, found $($files.Count)." }
          $files | ForEach-Object { "$($_.Name) $($_.Length) bytes" }

      # ST-070: the same trick for the shell. RenderTargetBitmap draws offscreen, so this works on a
      # runner with no interactive desktop — which is what makes a WPF shell checkable without a machine
      # to look at. A blank or tiny PNG means the window rendered nothing, which is what a missing
      # resource key or a style on the wrong target type actually produces.
      - name: Shell screenshots
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'gallery'
          dotnet run --project ScreenTail.UI -c Release --no-build -- --screenshot $out
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $shell = Get-ChildItem $out -Filter 'shell-*.png'
          if ($shell.Count -lt 6) { throw "Expected 6 shell screenshots, found $($shell.Count)." }
          foreach ($file in $shell) {
            if ($file.Length -lt 10000) { throw "$($file.Name) is $($file.Length) bytes; the shell rendered nothing." }
          }
          $shell | ForEach-Object { "$($_.Name) $($_.Length) bytes" }

      - name: Upload gallery screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gallery-screenshots
          path: ${{ runner.temp }}/gallery
          if-no-files-found: warn

  backend:
    name: Backend (build, test, container)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore ScreenTail.Backend.sln
      - name: Format and analyzers
        run: dotnet format ScreenTail.Backend.sln --verify-no-changes --no-restore
      - name: Build (warnings are errors)
        run: dotnet build ScreenTail.Backend.sln -c Release --no-restore
      - name: Test
        run: dotnet test ScreenTail.Backend.sln -c Release --no-build
      - name: Container build
        working-directory: .
        run: docker build -f backend/Dockerfile -t screentail-api:ci .

  web:
    name: Web
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  research:
    name: Research
    needs: changes
    if: needs.changes.outputs.research == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: research
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: research/requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

  schema:
    name: Schema (examples, generated code up to date)
    needs: changes
    if: needs.changes.outputs.schema == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: shared/schema
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: shared/schema/package-lock.json
      - run: npm ci
      - name: Examples validate
        run: npm test
      - name: Generated C# and TypeScript match the schema
        run: npm run check

  design:
    name: Design tokens (generated code up to date)
    needs: changes
    if: needs.changes.outputs.design == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: shared/design
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Generated WPF dictionaries and CSS match tokens.json
        run: npm run check

  workflows:
    name: Workflows are well-formed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      # A duplicate key is valid YAML — the last one silently wins — but GitHub rejects the file, and a
      # bad merge resolution produces exactly that. This says which key and which line, before the push.
      - name: No duplicate keys, every job has steps
        run: |
          python3 - <<'EOF'
          import pathlib, sys, yaml

          bad = []

          class Loader(yaml.SafeLoader):
              pass

          def mapping(loader, node, deep=False):
              seen, out = set(), {}
              for key_node, value_node in node.value:
                  key = loader.construct_object(key_node, deep=deep)
                  if key in seen:
                      bad.append(f"{path}: duplicate key {key!r} on line {key_node.start_mark.line + 1}")
                  seen.add(key)
                  out[key] = loader.construct_object(value_node, deep=deep)
              return out

          Loader.add_constructor(yaml.resolver.BaseResolver.DEFAULT_MAPPING_TAG, mapping)

          for path in sorted(pathlib.Path(".github/workflows").glob("*.yml")):
              document = yaml.load(path.read_text(), Loader)
              for name, job in document.get("jobs", {}).items():
                  if not job.get("steps"):
                      bad.append(f"{path}: job {name!r} has no steps")

          print("\n".join(bad) if bad else "workflows look fine")
          sys.exit(1 if bad else 0)
          EOF

  commits:
    name: Conventional commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          pattern='^(feat|fix|docs|test|ci|chore|refactor|perf|build|style|revert)(\([a-z0-9._/-]+\))?!?: .+'
          bad=0
          for sha in $(git rev-list --no-merges "$BASE..$HEAD"); do
            subject=$(git log -1 --format=%s "$sha")
            if ! printf '%s\n' "$subject" | grep -Eq "$pattern"; then
              echo "::error::Commit $sha is not a conventional commit (Guide §5)."
              printf '  subject: %s\n' "$subject"
              bad=1
            fi
            if ! git log -1 --format=%B "$sha" | grep -Eq '^Refs: ST-[0-9]{3}'; then
              echo "::error::Commit $sha has no 'Refs: ST-###' footer (Guide §5)."
              bad=1
            fi
          done
          exit $bad

  ci-ok:
    name: ci-ok
    if: always()
    needs: [changes, client, backend, web, research, schema, design, commits, workflows]
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          printf '%s\n' "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if printf '%s\n' "$RESULTS" | jq -e 'to_entries | any(.value.result != "success" and .value.result != "skipped")' >/dev/null; then
            echo "::error::A required job failed or was cancelled."
            exit 1
          fi
