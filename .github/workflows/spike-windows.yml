name: spike-windows

# ST-001: build the spike on Windows and produce the evidence that needs no human.
#  - hosted: GitHub's Windows VM. Catches build breaks and start-up crashes; its numbers don't count.
#  - laptop: the spare laptop as a self-hosted runner (scripts/windows/setup-test-laptop.ps1).
#            Real hardware, including a 5-minute synthetic-typing AC1 run. Enabled by the repo
#            variable HW_RUNNER=true once the runner is online.
# RDP (AC2) and a confirming human typing run still need a person: spike/run-spike.ps1.

# Run by hand, not by every pull request (2026-09-20 review).
#
# The ST-001 spike is finished and its answer is in the ADR. What kept running was the evidence job: in
# the five days to 2026-09-20 every one of its thirteen runs came from a `scripts/windows/**` change and
# none from `spike/**`, and each one put a 401-second synthetic-load step in front of the single laptop.
# That laptop runs one job at a time, so a one-line script edit was taking the hardware gate's place in
# the queue and turning a 220-second pull request into a 630-second one.
#
# It still runs on demand, which is what a spike is for.
on:
  workflow_dispatch:

# Read-only, said here rather than inherited from a repository default somebody can change.
permissions:
  contents: read

concurrency:
  group: spike-windows-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'

jobs:
  hosted:
    name: Hosted runner - build, test, automated checks
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
        working-directory: spike
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Build
        run: dotnet build ScreenTail.Spike.sln -c Release

      - name: Unit tests
        run: dotnet test Spike.Core.Tests -c Release --no-build

      - name: Parse-check scripts (Windows PowerShell 5.1)
        shell: powershell
        run: |
          $failed = $false
          $scripts = 'run-spike.ps1', 'ci-checks.ps1',
                     '..\scripts\windows\setup-test-laptop.ps1',
                     '..\scripts\windows\check-skips.ps1',
                     '..\scripts\windows\run-local.ps1'
          foreach ($file in $scripts) {
            $path = (Resolve-Path $file).Path
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$null, [ref]$errors)
            foreach ($e in $errors) { Write-Host "::error file=$file::$e"; $failed = $true }

            # 5.1 reads a BOM-less .ps1 as ANSI, so one non-ASCII character corrupts everything after it
            # and the parser fails somewhere unrelated. Cheaper to forbid the character than to debug the
            # error it produces on a machine three time zones away (ST-018).
            $bytes = [System.IO.File]::ReadAllBytes($path)
            $high = @($bytes | Where-Object { $_ -gt 127 })
            if ($high.Count -gt 0) {
              Write-Host "::error file=$file::$($high.Count) non-ASCII byte(s). Windows PowerShell 5.1 reads this file as ANSI and will mis-parse it. Use plain ASCII."
              $failed = $true
            }
          }
          if ($failed) { exit 1 }

      # The hosted VM's desktop may not behave like a laptop's; record, don't gate.
      - name: Automated checks (AC3, AC4, smoke run)
        continue-on-error: true
        run: ./ci-checks.ps1 -Evidence (Join-Path $env:RUNNER_TEMP 'st-001-evidence') -RunMode smoke

      # The same allowlist the laptop job uses. This runner's desktop is a fresh VM with nothing
      # private on it, so the risk is small - but "small" is a reason to keep the rule in one shape
      # everywhere rather than to have two rules, one of which is the careful one.
      - name: Only text leaves this machine
        id: outbox
        if: always()
        shell: powershell
        run: |
          $src = Join-Path $env:RUNNER_TEMP 'st-001-evidence'
          $out = Join-Path $env:RUNNER_TEMP 'st-001-evidence-outbox'
          Remove-Item $out -Recurse -Force -ErrorAction SilentlyContinue
          $null = New-Item -ItemType Directory -Path $out -Force
          if (Test-Path $src) {
            # What the evidence actually is: verdicts, measurements and the machine facts beside them.
            $allowed = '.md', '.txt', '.json', '.trx', '.csv'
            $kept = 0
            foreach ($file in Get-ChildItem $src -Recurse -File) {
              if ($allowed -contains $file.Extension.ToLowerInvariant()) {
                $relative = $file.FullName.Substring($src.Length).TrimStart('\')
                $destination = Join-Path $out $relative
                $null = New-Item -ItemType Directory -Path (Split-Path $destination -Parent) -Force
                Copy-Item -LiteralPath $file.FullName -Destination $destination
                $kept++
              } else {
                Write-Host "Left behind: $($file.Name)"
              }
            }
            Write-Host "Prepared $kept file(s) for upload."
          }

      - name: Upload evidence
        if: always() && steps.outbox.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: st-001-evidence-hosted
          path: ${{ runner.temp }}/st-001-evidence-outbox
          if-no-files-found: warn

  laptop:
    name: Spare laptop - real hardware, synthetic 5-min load
    # Never for a pull request from a fork. This line is the second lock, not the first: a pull request
    # runs its own copy of this file, so a stranger could delete it. What actually keeps strangers' code
    # off the laptop is a repository setting they cannot touch - only collaborators may open pull
    # requests, and every outside contributor's run needs approval. This catches the day someone
    # loosens that setting without thinking about what is attached to the other end.
    if: >-
      vars.HW_RUNNER == 'true' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, Windows, screentail-win]
    timeout-minutes: 30
    defaults:
      run:
        # Windows PowerShell 5.1: the laptop has no pwsh, and the scripts target 5.1 anyway.
        shell: powershell -ExecutionPolicy Bypass -Command ". '{0}'"
        working-directory: spike
    steps:
      - uses: actions/checkout@v7
        with:
          # The laptop's work directory outlives the job. A token left in .git/config there is a token
          # the next job can read.
          persist-credentials: false

      # The laptop already has the SDKs (scripts/windows/setup-test-laptop.ps1). setup-dotnet would try to
      # install into C:\Program Files\dotnet, which the non-admin runner account cannot write to.
      - name: Use the preinstalled .NET SDK
        run: |
          if (-not (Get-Command dotnet -ErrorAction SilentlyContinue)) {
            $installed = Join-Path $env:ProgramFiles 'dotnet'
            if (-not (Test-Path (Join-Path $installed 'dotnet.exe'))) {
              throw 'No .NET SDK on this runner. Re-run scripts/windows/setup-test-laptop.ps1.'
            }
            [System.IO.File]::AppendAllText($env:GITHUB_PATH, "$installed`r`n")
            $env:Path = "$installed;$env:Path"
          }
          dotnet --list-sdks

      - name: Build
        run: dotnet build ScreenTail.Spike.sln -c Release

      - name: Automated checks (AC1 synthetic, AC3, AC4)
        run: ./ci-checks.ps1 -Evidence (Join-Path $env:RUNNER_TEMP 'st-001-evidence') -RunMode synthetic-load

      # The laptop is a real desktop and this repository is public. A capture taken here is a picture of
      # whatever was on the screen - a browser tab, a notification - and an artifact on a public
      # repository can be downloaded by anyone signed in to GitHub. One already showed the owner's
      # browser. The verdicts are text and are what the evidence is; the pictures stay on the machine.
      #
      # An allowlist, copied into a clean directory, rather than deleting the images out of the one that
      # gets uploaded. Deleting was the rule stated the wrong way round: it had to name every extension a
      # picture might have, and one file held open by a test or by antivirus made Remove-Item throw -
      # which under GitHub's 'stop' preference abandoned the rest of the step while the upload, being
      # `if: always()`, published the directory anyway. Now nothing reaches the upload unless it was
      # copied there by name (2026-09-20 review).
      - name: Only text leaves this machine
        id: outbox
        if: always()
        shell: powershell
        run: |
          $src = Join-Path $env:RUNNER_TEMP 'st-001-evidence'
          $out = Join-Path $env:RUNNER_TEMP 'st-001-evidence-outbox'
          Remove-Item $out -Recurse -Force -ErrorAction SilentlyContinue
          $null = New-Item -ItemType Directory -Path $out -Force
          if (Test-Path $src) {
            # What the evidence actually is: verdicts, measurements and the machine facts beside them.
            $allowed = '.md', '.txt', '.json', '.trx', '.csv'
            $kept = 0
            foreach ($file in Get-ChildItem $src -Recurse -File) {
              if ($allowed -contains $file.Extension.ToLowerInvariant()) {
                $relative = $file.FullName.Substring($src.Length).TrimStart('\')
                $destination = Join-Path $out $relative
                $null = New-Item -ItemType Directory -Path (Split-Path $destination -Parent) -Force
                Copy-Item -LiteralPath $file.FullName -Destination $destination
                $kept++
              } else {
                Write-Host "Left behind: $($file.Name)"
              }
            }
            Write-Host "Prepared $kept file(s) for upload."
          }

      - name: Upload evidence
        if: always() && steps.outbox.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: st-001-evidence-laptop
          path: ${{ runner.temp }}/st-001-evidence-outbox
          if-no-files-found: warn
          retention-days: 7
