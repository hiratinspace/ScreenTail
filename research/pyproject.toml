[project]
name = "screentail-research"
version = "0.0.0"
description = "Prompts, evaluation harness and fixtures for ScreenTail drafts"
requires-python = ">=3.11"
dependencies = []

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
